<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Shubha ki Naukri — CANCEL!!!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0a0409;
    --maroon-deep: #22071a;
    --maroon: #3a0d24;
    --gold: #f0b93e;
    --gold-soft: #f6d488;
    --gold-deep: #b9821e;
    --magenta: #ff3366;
    --magenta-deep: #b31741;
    --cream: #fbefdb;
    --cream-dim: #d9c9ab;
    --font-display: 'Baloo 2', system-ui, sans-serif;
    --font-body: 'Poppins', system-ui, sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    font-family: var(--font-body);
  }

  #bg-canvas{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }

  .vignette{
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(58,13,36,0) 0%, rgba(10,4,9,0) 40%, rgba(10,4,9,0.65) 100%);
  }

  .flash{
    position: fixed;
    inset: 0;
    z-index: 3;
    background: radial-gradient(circle at 50% 44%, #fff6df 0%, #ffe6ab 35%, rgba(255,230,171,0) 70%);
    opacity: 0;
    pointer-events: none;
  }

  .stage{
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vh 5vw;
  }

  .spark{
    position: absolute;
    left: 50%;
    top: 62%;
    width: 10px;
    height: 10px;
    margin: -5px 0 0 -5px;
    border-radius: 50%;
    background: var(--gold-soft);
    box-shadow:
      0 0 12px 4px rgba(240,185,62,0.9),
      0 0 30px 12px rgba(255,51,102,0.35);
    opacity: 0;
    transform: scale(0.4);
    z-index: 2;
  }

  .text-wrap{
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(0.2rem, 1.2vh, 0.6rem);
    max-width: 92vw;
    padding-bottom: clamp(3rem, 9vh, 5.5rem);
  }

  .eyebrow{
    font-family: var(--font-body);
    font-style: italic;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: clamp(0.65rem, 1.6vw, 0.95rem);
    color: var(--cream-dim);
    opacity: 0;
  }

  .line-1{
    font-family: var(--font-display);
    font-weight: 500;
    color: var(--cream-dim);
    font-size: clamp(1.3rem, 4.4vw, 2.6rem);
    letter-spacing: 0.01em;
    opacity: 0;
  }

  .line-2{
    font-family: var(--font-display);
    font-weight: 700;
    background: linear-gradient(180deg, var(--gold-soft) 10%, var(--gold) 55%, var(--gold-deep) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-size: clamp(2.6rem, 9vw, 6rem);
    line-height: 1;
    letter-spacing: 0.01em;
    opacity: 0;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,0.25));
    margin-bottom: clamp(1.4rem, 5vh, 2.6rem);
  }

  .stamp-zone{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ink-splat{
    position: absolute;
    left: 50%;
    top: 50%;
    width: 126%;
    height: 168%;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    z-index: 1;
    pointer-events: none;
  }
  .ink-splat svg{ width: 100%; height: 100%; display:block; filter: blur(0.5px); }

  .stamp{
    position: relative;
    z-index: 2;
    display: inline-block;
    font-family: var(--font-display);
    font-weight: 800;
    color: var(--magenta);
    font-size: clamp(2.6rem, min(11vw, 13vh), 7.6rem);
    line-height: 0.92;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    padding: clamp(0.3rem, 1.6vw, 0.9rem) clamp(0.9rem, 3.2vw, 2rem);
    border: clamp(4px, 0.9vw, 8px) solid var(--magenta);
    border-radius: 14px;
    box-shadow:
      inset 0 0 0 clamp(2px, 0.4vw, 4px) rgba(255,51,102,0.55);
    opacity: 0;
    text-shadow:
      1px 0 0 rgba(255,51,102,0.55),
      -1px 0 0 rgba(255,51,102,0.35),
      0 2px 10px rgba(255,51,102,0.25);
    white-space: nowrap;
    overflow: hidden;
    isolation: isolate;
  }
  .stamp::before{
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    background: repeating-linear-gradient(
      100deg,
      rgba(10,4,9,0) 0px,
      rgba(10,4,9,0) 3px,
      rgba(10,4,9,0.16) 4px,
      rgba(10,4,9,0) 6px
    );
    mix-blend-mode: multiply;
    opacity: 0.5;
  }
  .stamp .excl{ color: var(--gold); }

  .replay{
    position: fixed;
    bottom: clamp(1.2rem, 4vh, 2.5rem);
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: clamp(0.75rem, 1.8vw, 0.95rem);
    letter-spacing: 0.04em;
    color: var(--cream);
    background: rgba(251,239,219,0.06);
    border: 1px solid rgba(251,239,219,0.28);
    padding: 0.65em 1.4em;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0;
    backdrop-filter: blur(6px);
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.15s ease;
  }
  .replay:hover{
    background: rgba(251,239,219,0.14);
    border-color: rgba(251,239,219,0.5);
  }
  .replay:active{ transform: translateX(-50%) scale(0.96); }
  .replay:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  @media (max-width: 480px){
    .stamp{ border-width: 4px; border-radius: 10px; }
  }

  @media (prefers-reduced-motion: reduce){
    .spark{ display:none; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="vignette"></div>
<div class="flash"></div>

<div class="stage">
  <div class="spark"></div>
  <div class="text-wrap">
    <p class="eyebrow">breaking news</p>
    <p class="line-1">Shubha ki</p>
    <p class="line-2">Naukri</p>
    <div class="stamp-zone">
      <div class="ink-splat">
        <svg viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg">
          <path fill="#ff3366" opacity="0.4" d="M230 18c40 0 78 14 96 32 16 16 8 30 24 46 15 15 26 30 16 48-11 20-32 20-46 36-13 15-8 30-32 38-26 9-40-8-68-6-25 2-38 20-64 13-24-7-30-26-53-32-24-6-42 6-56-12-13-16-3-32-14-50-10-17-28-22-22-42 6-19 26-20 36-38 9-17-2-32 16-46 17-14 34-4 54-14 20-10 24-28 54-28 20 0 34 8 59 5z"/>
        </svg>
      </div>
      <div class="stamp">CANCEL<span class="excl">!!!</span></div>
    </div>
  </div>
</div>

<button class="replay" aria-label="Replay the animation">Phir se dekho ↺</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  "use strict";

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- THREE.JS PARTICLE FIELD ---------- */

  var canvas = document.getElementById('bg-canvas');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.z = 480;

  function makeDotTexture(){
    var size = 64;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    var g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.35, 'rgba(255,255,255,0.9)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
  }
  var dotTexture = makeDotTexture();

  var isNarrow = window.innerWidth < 640;

  /* ambient drifting gold dust */
  var AMBIENT_COUNT = isNarrow ? 140 : 260;
  var ambientGeo = new THREE.BufferGeometry();
  var ambientPos = new Float32Array(AMBIENT_COUNT * 3);
  var ambientColor = new Float32Array(AMBIENT_COUNT * 3);
  var ambientSpeed = new Float32Array(AMBIENT_COUNT);

  var goldC = new THREE.Color(0xf0b93e);
  var magentaC = new THREE.Color(0xff3366);
  var creamC = new THREE.Color(0xfbefdb);

  for (var i = 0; i < AMBIENT_COUNT; i++){
    var ix = i * 3;
    ambientPos[ix]     = (Math.random() - 0.5) * 1400;
    ambientPos[ix + 1] = (Math.random() - 0.5) * 900;
    ambientPos[ix + 2] = (Math.random() - 0.5) * 700;
    var pick = Math.random();
    var col = pick < 0.55 ? goldC : (pick < 0.85 ? creamC : magentaC);
    ambientColor[ix] = col.r; ambientColor[ix+1] = col.g; ambientColor[ix+2] = col.b;
    ambientSpeed[i] = 0.15 + Math.random() * 0.35;
  }
  ambientGeo.setAttribute('position', new THREE.BufferAttribute(ambientPos, 3));
  ambientGeo.setAttribute('color', new THREE.BufferAttribute(ambientColor, 3));

  var ambientMat = new THREE.PointsMaterial({
    size: isNarrow ? 5 : 6,
    map: dotTexture,
    vertexColors: true,
    transparent: true,
    opacity: 0.55,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  var ambientPoints = new THREE.Points(ambientGeo, ambientMat);
  scene.add(ambientPoints);

  /* rocket trail sparks */
  var trailGeo = new THREE.BufferGeometry();
  var TRAIL_MAX = 40;
  var trailPos = new Float32Array(TRAIL_MAX * 3);
  for (var t = 0; t < TRAIL_MAX * 3; t++){ trailPos[t] = 9999; }
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
  var trailMat = new THREE.PointsMaterial({
    size: 5, map: dotTexture, color: 0xf6d488,
    transparent: true, opacity: 0.85, depthWrite: false, blending: THREE.AdditiveBlending
  });
  var trailPoints = new THREE.Points(trailGeo, trailMat);
  scene.add(trailPoints);
  var trailIndex = 0;

  /* burst particle system (created empty, filled on triggerBurst) */
  var BURST_COUNT = isNarrow ? 420 : 800;
  var burstGeo = new THREE.BufferGeometry();
  var burstPos = new Float32Array(BURST_COUNT * 3);
  var burstVel = new Float32Array(BURST_COUNT * 3);
  var burstColor = new Float32Array(BURST_COUNT * 3);
  var burstLife = new Float32Array(BURST_COUNT);
  var burstActive = false;

  for (var b = 0; b < BURST_COUNT; b++){
    burstPos[b*3] = 0; burstPos[b*3+1] = -9999; burstPos[b*3+2] = 0;
  }
  burstGeo.setAttribute('position', new THREE.BufferAttribute(burstPos, 3));
  burstGeo.setAttribute('color', new THREE.BufferAttribute(burstColor, 3));

  var burstMat = new THREE.PointsMaterial({
    size: isNarrow ? 7 : 9,
    map: dotTexture,
    vertexColors: true,
    transparent: true,
    opacity: 1,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  var burstPoints = new THREE.Points(burstGeo, burstMat);
  scene.add(burstPoints);

  /* gentle falling confetti dust, activated after burst */
  var CONFETTI_COUNT = isNarrow ? 90 : 170;
  var confettiGeo = new THREE.BufferGeometry();
  var confettiPos = new Float32Array(CONFETTI_COUNT * 3);
  var confettiColor = new Float32Array(CONFETTI_COUNT * 3);
  var confettiSpeed = new Float32Array(CONFETTI_COUNT);
  var confettiActive = false;

  for (var cI = 0; cI < CONFETTI_COUNT; cI++){
    var cx = cI * 3;
    confettiPos[cx]     = (Math.random() - 0.5) * 1000;
    confettiPos[cx + 1] = 600 + Math.random() * 500;
    confettiPos[cx + 2] = (Math.random() - 0.5) * 500;
    var cpick = Math.random();
    var ccol = cpick < 0.5 ? goldC : (cpick < 0.8 ? magentaC : creamC);
    confettiColor[cx] = ccol.r; confettiColor[cx+1] = ccol.g; confettiColor[cx+2] = ccol.b;
    confettiSpeed[cI] = 0.6 + Math.random() * 1.2;
  }
  confettiGeo.setAttribute('position', new THREE.BufferAttribute(confettiPos, 3));
  confettiGeo.setAttribute('color', new THREE.BufferAttribute(confettiColor, 3));
  var confettiMat = new THREE.PointsMaterial({
    size: isNarrow ? 5 : 6,
    map: dotTexture,
    vertexColors: true,
    transparent: true,
    opacity: 0,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  var confettiPoints = new THREE.Points(confettiGeo, confettiMat);
  scene.add(confettiPoints);

  function triggerBurst(){
    burstActive = true;
    var colorChoices = [goldC, magentaC, creamC];
    for (var i = 0; i < BURST_COUNT; i++){
      var ix = i * 3;
      burstPos[ix] = 0; burstPos[ix+1] = 40; burstPos[ix+2] = 0;

      var theta = Math.random() * Math.PI * 2;
      var phi = Math.acos((Math.random() * 2) - 1);
      var speed = 2.2 + Math.random() * 5.2;
      burstVel[ix]   = Math.sin(phi) * Math.cos(theta) * speed;
      burstVel[ix+1] = Math.sin(phi) * Math.sin(theta) * speed + 1.2;
      burstVel[ix+2] = Math.cos(phi) * speed * 0.6;

      var col = colorChoices[Math.floor(Math.random() * colorChoices.length)];
      burstColor[ix] = col.r; burstColor[ix+1] = col.g; burstColor[ix+2] = col.b;

      burstLife[i] = 1.0;
    }
    burstGeo.attributes.position.needsUpdate = true;
    burstGeo.attributes.color.needsUpdate = true;

    setTimeout(function(){ confettiActive = true; }, 250);
  }

  function pushTrail(x, y, z){
    var idx = trailIndex % TRAIL_MAX;
    trailPos[idx*3] = x; trailPos[idx*3+1] = y; trailPos[idx*3+2] = z;
    trailIndex++;
    trailGeo.attributes.position.needsUpdate = true;
  }

  var mouseX = 0, mouseY = 0;
  window.addEventListener('mousemove', function(e){
    mouseX = (e.clientX / window.innerWidth - 0.5);
    mouseY = (e.clientY / window.innerHeight - 0.5);
  });

  var clock = new THREE.Clock();

  function animate(){
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);

    /* ambient dust drift */
    var posArr = ambientGeo.attributes.position.array;
    for (var i = 0; i < AMBIENT_COUNT; i++){
      var ix = i * 3;
      posArr[ix+1] -= ambientSpeed[i] * dt * 22;
      posArr[ix]   += Math.sin((posArr[ix+1] + i) * 0.01) * 0.06;
      if (posArr[ix+1] < -450){ posArr[ix+1] = 450; }
    }
    ambientGeo.attributes.position.needsUpdate = true;

    /* burst physics */
    if (burstActive){
      var bp = burstGeo.attributes.position.array;
      var bc = burstGeo.attributes.color.array;
      var stillAlive = false;
      for (var j = 0; j < BURST_COUNT; j++){
        if (burstLife[j] <= 0) continue;
        var jx = j * 3;
        burstVel[jx+1] -= 4.2 * dt;
        bp[jx]   += burstVel[jx] * dt * 60 * 0.5;
        bp[jx+1] += burstVel[jx+1] * dt * 60 * 0.5;
        bp[jx+2] += burstVel[jx+2] * dt * 60 * 0.5;
        burstLife[j] -= dt * 0.5;
        if (burstLife[j] > 0) stillAlive = true;
        else { bp[jx+1] = -9999; }
      }
      burstGeo.attributes.position.needsUpdate = true;
      burstMat.opacity = Math.max(0, burstMat.opacity);
      if (!stillAlive){ burstActive = false; }
    }

    /* confetti fall */
    if (confettiActive){
      confettiMat.opacity += (0.75 - confettiMat.opacity) * 0.03;
      var fp = confettiGeo.attributes.position.array;
      for (var k = 0; k < CONFETTI_COUNT; k++){
        var kx = k * 3;
        fp[kx+1] -= confettiSpeed[k] * dt * 26;
        fp[kx]   += Math.sin((fp[kx+1] + k * 3) * 0.02) * 0.15;
        if (fp[kx+1] < -450){ fp[kx+1] = 500 + Math.random() * 100; }
      }
      confettiGeo.attributes.position.needsUpdate = true;
    }

    /* subtle parallax camera drift */
    camera.position.x += (mouseX * 60 - camera.position.x) * 0.03;
    camera.position.y += (-mouseY * 40 - camera.position.y) * 0.03;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', function(){
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });

  /* ---------- GSAP REVEAL TIMELINE ---------- */

  var spark = document.querySelector('.spark');
  var flash = document.querySelector('.flash');
  var eyebrow = document.querySelector('.eyebrow');
  var line1 = document.querySelector('.line-1');
  var line2 = document.querySelector('.line-2');
  var stamp = document.querySelector('.stamp');
  var inkSplat = document.querySelector('.ink-splat');
  var replayBtn = document.querySelector('.replay');
  var stageEl = document.querySelector('.stage');

  function resetVisual(){
    gsap.set([spark, eyebrow, line1, line2, stamp, inkSplat, flash], { clearProps: 'all' });
    gsap.set(spark, { opacity: 0, scale: 0.4, x: 0, y: 0 });
    gsap.set(eyebrow, { opacity: 0, y: 10 });
    gsap.set(line1, { opacity: 0, y: -30 });
    gsap.set(line2, { opacity: 0, y: -30, scale: 0.85 });
    gsap.set(inkSplat, { opacity: 0, scale: 0, rotate: 0 });
    gsap.set(stamp, { opacity: 0, y: -260, rotate: -22, scale: 1.35 });
    gsap.set(flash, { opacity: 0 });
    gsap.set(replayBtn, { opacity: 0 });
  }

  function shakeScreen(){
    var tl = gsap.timeline();
    var amount = 14;
    tl.to(stageEl, { x: -amount, y: amount * 0.4, duration: 0.05 })
      .to(stageEl, { x: amount, y: -amount * 0.3, duration: 0.05 })
      .to(stageEl, { x: -amount * 0.6, y: amount * 0.2, duration: 0.05 })
      .to(stageEl, { x: amount * 0.3, y: 0, duration: 0.05 })
      .to(stageEl, { x: 0, y: 0, duration: 0.08 });
  }

  var masterTl;

  function playIntro(){
    if (masterTl) masterTl.kill();
    resetVisual();
    burstActive = false;
    confettiActive = false;
    confettiMat.opacity = 0;

    if (reduceMotion){
      gsap.set([eyebrow, line1, line2, inkSplat, stamp, replayBtn], { opacity: 1 });
      gsap.set(inkSplat, { scale: 1 });
      gsap.set(stamp, { y: 0, rotate: -6, scale: 1 });
      return;
    }

    masterTl = gsap.timeline({ defaults: { ease: 'power2.out' } });

    masterTl
      .to(spark, { opacity: 1, scale: 2.4, duration: 1.0, ease: 'power1.out' })
      .to(spark, {
        y: -window.innerHeight * 0.42,
        scale: 0.5,
        duration: 0.55,
        ease: 'power4.in',
        onUpdate: function(){
          var prog = this.progress();
          var rect = spark.getBoundingClientRect();
          var vx = (rect.left + rect.width/2 - window.innerWidth/2) * 0.7;
          var vy = -(rect.top + rect.height/2 - window.innerHeight/2) * 0.7;
          pushTrail(vx, vy, 0);
        }
      }, '>-0.05')
      .call(function(){ triggerBurst(); })
      .to(flash, { opacity: 1, duration: 0.09, ease: 'power1.in' }, '<')
      .to(spark, { opacity: 0, duration: 0.15 }, '<')
      .to(flash, { opacity: 0, duration: 0.75, ease: 'power2.out' }, '>-0.02')
      .to(eyebrow, { opacity: 1, y: 0, duration: 0.4 }, '<')
      .to(line1, { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(1.8)' }, '<0.08')
      .to(line2, { opacity: 1, y: 0, scale: 1, duration: 0.65, ease: 'back.out(1.9)' }, '<0.15')
      .to(inkSplat, { opacity: 0.85, scale: 1, rotate: -3, duration: 0.35, ease: 'power2.out' }, '<0.35')
      .to(stamp, {
        opacity: 1, y: 0, rotate: -6, scale: 1,
        duration: 0.45, ease: 'power4.in'
      }, '<0.05')
      .call(function(){ shakeScreen(); triggerBurst(); })
      .to(replayBtn, { opacity: 1, duration: 0.5 }, '>0.2');
  }

  replayBtn.addEventListener('click', playIntro);

  window.addEventListener('load', function(){
    setTimeout(playIntro, reduceMotion ? 0 : 300);
  });
})();
</script>

</body>
</html>
